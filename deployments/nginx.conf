# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;

# Gzip compression
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss image/svg+xml;

# Upstream for app
upstream app_backend {
    server app:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost api.example.com;

    client_max_body_size 100M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    keepalive_timeout 65;
    send_timeout 60s;

    # ==========================================
    # SECURITY HEADERS
    # ==========================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ==========================================
    # BOT BLOCKING
    # ==========================================
    if ($http_user_agent ~* (bot|crawler|spider|scraper|curl|wget|python-requests|go-http-client|nikto|sqlmap|nmap|masscan|zgrab|burp|w3af|wpscan|joomscan|drupalscan|openvas|nessus|AhrefsBot|SemrushBot|DotBot|MJ12bot|BLEXBot|DataForSeoBot|Amazonbot|GPTBot|Bytespider|FacebookBot|Google-Extended) ) {
        return 403;
    }

    if ($http_user_agent = "") {
        return 403;
    }

    # ==========================================
    # BLOCK ATTACK PATTERNS
    # ==========================================
    if ($query_string ~* (union.*select|select.*from|information_schema|table_name|concat|benchmark|sleep|load_file|outfile|dumpfile|<script|alert|onerror|onload|javascript:|prompt|confirm|eval|document\.cookie|\.\./|\.\.%2f|\.\.%2F|\.\.%252f|\.\.%252F) ) {
        return 403;
    }

    # ==========================================
    # BLOCK SENSITIVE FILES & PATHS
    # ==========================================
    location ~* \.(php|asp|aspx|jsp|jspx|cgi|pl|py|rb|sh)$ {
        return 403;
    }

    location ~* ^/(admin|administrator|wp-admin|wp-login|wp-content|wp-includes|xmlrpc.php|.env|.git|.svn|.hg|.idea|.vscode|backup|backups|tmp|temp|logs) {
        return 403;
    }

    location ~ /\. {
        return 403;
    }

    location ~* \.(sql|log|conf|config|yml|yaml|json|env|ini|xml|md|sh|bash|zsh|git)$ {
        return 403;
    }

    # ==========================================
    # HEALTH CHECK (NO RATE LIMITING)
    # ==========================================
    location /health {
        proxy_pass http://app_backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ==========================================
    # SWAGGER DOCS (LIMITED)
    # ==========================================
    location /swagger/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://app_backend/swagger/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================
    # API ENDPOINTS (FULL PROTECTION)
    # ==========================================
    location /api/ {
        # Rate limiting
        limit_req zone=api_limit burst=200 nodelay;
        limit_conn addr 50;
        limit_req_status 429;

        # Bot detection - only set variable (NO limit_req inside if!)
        if ($http_user_agent ~* (bot|crawler|spider|scraper|curl|wget) ) {
            set $bot_rate_limit "yes";
            # limit_req zone=bot_block burst=5 nodelay;  ← REMOVED - WAS CAUSING ERROR
        }

        proxy_pass http://app_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # Logging
        access_log /var/log/nginx/api_access.log;
        error_log /var/log/nginx/api_error.log;
    }

    # ==========================================
    # STATIC FILES
    # ==========================================
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ==========================================
    # UPLOADED FILES
    # ==========================================
    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        expires 1d;
        add_header Cache-Control "public";
        
        # Prevent direct execution of scripts in uploads
        location ~* \.(php|asp|aspx|jsp|jspx|cgi|pl|py|rb|sh)$ {
            return 403;
        }
    }

    # ==========================================
    # ROOT ENDPOINT
    # ==========================================
    location / {
        proxy_pass http://app_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================
    # ERROR PAGES
    # ==========================================
    error_page 404 /404.html;
    error_page 403 /403.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /403.html {
        root /usr/share/nginx/html;
        internal;
    }
    
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }
    
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}