[databases]
enterprise = host=postgres port=5432 dbname=enterprise

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = trust
auth_user = postgres
pool_mode = transaction
default_pool_size = 100
max_client_conn = 1000
max_db_connections = 200
server_idle_timeout = 300
query_timeout = 30
